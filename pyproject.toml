[project]
name = "ai-trading-system"
version = "0.1.0"
description = "AI-driven multi-agent trading system with reinforcement learning"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AI Trading Team"}
]
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pandas>=2.1.0",
    "polars>=0.20.0",
    "numpy>=1.26.0",
    "pyarrow>=14.0.0",
    "yfinance>=0.2.33",
    "alpaca-py>=0.13.0",
    "ta-lib>=0.4.28",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",
    "torch>=2.1.0",
    "pytorch-lightning>=2.1.0",
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.2.0",
    "d3rlpy>=2.3.0",
    "openai>=1.6.0",
    "crewai[tools]>=0.1.0",
    "langchain>=0.1.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
    "mlflow>=2.9.0",
    "dvc>=3.30.0",
    "prometheus-client>=0.19.0",
    "slack-sdk>=3.23.0",
    "python-telegram-bot>=20.7",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.8",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "structlog>=24.1.0",
    "apscheduler>=3.10.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
run-backtest = "src.cli:run_backtest"
run-paper = "src.cli:run_paper"
train-rl = "src.cli:train_rl"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
