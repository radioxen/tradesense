global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Trading system metrics
  - job_name: "trading-system"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: "/metrics"

  # TimescaleDB metrics (if using pg_prometheus)
  - job_name: "timescaledb"
    static_configs:
      - targets: ["timescaledb:5432"]

  # Redis metrics
  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
